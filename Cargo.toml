[package]
name = "typepress"
version = "0.5.0"
edition = "2024"
description = "Pure Rust HTML/CSS → PDF engine. No browser required."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alitrack/typepress"
# crates.io package contents: src + docs only. deps/ is local dev tooling
# (vendored blitz-html fork) — never ship it; also avoids a corrupted
# WSL dentry at deps/blitz-html that breaks `cargo package` directory scan.
include = [
    "src/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
    "Cargo.lock",
]

[dependencies]
# Core engine: fulgur provides HTML→PDF pipeline (Blitz→Taffy→Krilla)
fulgur = "0.39"
# CLI
clap = { version = "4", features = ["derive"] }
# LaTeX math rendering (pure Rust KaTeX)
katex = { package = "katex-rs", version = "0.2" }
# Regex for math detection
regex = "1"
# Mermaid diagram rendering (optional)
mermaid-render = { version = "0.7", optional = true }
resvg = { version = "0.45", optional = true }
tiny-skia = { version = "0.11", optional = true }
# Markdown input
pulldown-cmark = "0.13"
# Error handling
anyhow = "1"
thiserror = "2"
tempfile = "3"
# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# HTTP for @font-face web font downloading
reqwest = { version = "0.12", features = ["blocking"] }
# Code syntax highlighting
syntect = "5"
# Logging
log = "0.4"
env_logger = "0.11"
base64 = "0.22.1"
# SHA-256 for deterministic output verification
sha2 = "0.10"
# HTTP rendering server (P2) — tiny_http keeps the dependency tree minimal
# (blocking, single-binary friendly; no tokio/hyper family)
tiny_http = "0.12"

[features]
default = []
mermaid-render = ["dep:mermaid-render", "dep:resvg", "dep:tiny-skia"]

[profile.release]
lto = true
strip = true
opt-level = 3

[patch.crates-io]
fulgur = { path = "deps/fulgur" }
# blitz-html vendored: stock 0.2.0's TreeSink::finish prints raw `ERROR:`
# lines to stdout (corrupts --json machine output); we collect them as
# `parse_warnings` on HtmlDocument instead. NOTE: version must satisfy
# fulgur's `blitz-html = "0.2"` requirement (it does: we vendor 0.2.0).
blitz-html = { path = "deps/blitzhtml-vendor" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
sha2 = "0.10"
